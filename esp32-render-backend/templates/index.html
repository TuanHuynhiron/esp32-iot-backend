<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giam Sat Ciem Tra IoT - SIM7680C</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .alert-row { background-color: #ffcccc !important; }
        .img-thumb { width: 80px; height: 60px; object-fit: cover; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="mb-4 text-primary font-weight-bold">IoT Dashboard - ESP32 & SIM7680C</h2>
    
    <!-- Khối nhập Ngưỡng cảnh báo -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-dark text-white font-weight-bold">Cai Dat Nguong Canh Bao</div>
        <div class="card-body">
            <form id="threshForm" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Nhiệt độ tối đa (°C)</label>
                    <input type="number" step="0.1" class="form-control" id="tempThresh">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Độ ẩm tối đa (%)</label>
                    <input type="number" step="0.1" class="form-control" id="humThresh">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Độ rung tối đa (m/s²)</label>
                    <input type="number" step="0.1" class="form-control" id="vibThresh">
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button type="button" onclick="saveThresholds()" class="btn btn-success w-100">Lưu Cấu Hình</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bảng Dữ Liệu -->
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white font-weight-bold">Lịch Sử Dữ Liệu & Hình Ảnh</div>
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Thời Gian</th>
                        <th>Nhiệt Độ (°C)</th>
                        <th>Độ Ẩm (%)</th>
                        <th>Độ Rung (m/s²)</th>
                        <th>Hình Ảnh</th>
                        <th>Thao Tác</th>
                    </tr>
                </thead>
                <tbody id="dataTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
let currentThresh = { temp: 35, hum: 80, vib: 5 };

async function loadData() {
    const res = await fetch('/api/data');
    const json = await res.json();
    currentThresh = json.thresholds;
    
    document.getElementById('tempThresh').value = currentThresh.temp;
    document.getElementById('humThresh').value = currentThresh.hum;
    document.getElementById('vibThresh').value = currentThresh.vib;

    const tbody = document.getElementById('dataTable');
    tbody.innerHTML = '';

    json.records.forEach(row => {
        const isAlert = row.temp > currentThresh.temp || row.hum > currentThresh.hum || row.vib > currentThresh.vib;
        const tr = document.createElement('tr');
        if (isAlert) tr.classList.add('alert-row');

        const imgTag = row.img_path 
            ? `<a href="/static/uploads/${row.img_path}" target="_blank"><img src="/static/uploads/${row.img_path}" class="img-thumb"></a>` 
            : '<span class="text-muted">Không có</span>';

        tr.innerHTML = `
            <td>${row.id}</td>
            <td>${row.timestamp}</td>
            <td><b>${row.temp}</b></td>
            <td><b>${row.hum}</b></td>
            <td><b>${row.vib}</b></td>
            <td>${imgTag}</td>
            <td><button class="btn btn-sm btn-danger" onclick="deleteRecord(${row.id})">Xóa</button></td>
        `;
        tbody.appendChild(tr);
    });
}

async function saveThresholds() {
    const temp = parseFloat(document.getElementById('tempThresh').value);
    const hum = parseFloat(document.getElementById('humThresh').value);
    const vib = parseFloat(document.getElementById('vibThresh').value);

    await fetch('/api/thresholds', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ temp, hum, vib })
    });
    alert('Đã cập nhật ngưỡng cảnh báo!');
    loadData();
}

async function deleteRecord(id) {
    if (confirm('Bạn có chắc chắn muốn xóa mốc dữ liệu này?')) {
        await fetch(`/api/delete/${id}`, { method: 'DELETE' });
        loadData();
    }
}

setInterval(loadData, 5000);
loadData();
</script>
</body>
</html>
